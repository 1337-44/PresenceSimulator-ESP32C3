<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
 <title id="title">Podłączenie ESP32-C3 SuperMini do NeoPixel WS2812B przez 74AHCT125</title>
 <desc id="desc">GPIO4 ESP32-C3 przechodzi przez 74AHCT125 oraz rezystor 330 omów do DIN NeoPixel. ESP32, konwerter poziomów i taśma mają wspólną masę. Taśma i 74AHCT125 są zasilane z osobnego zasilacza 5 V. Kondensator 1000 uF jest między 5 V i masą taśmy.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6087"/></marker></defs>
 <rect width="1040" height="510" rx="18" fill="#f6f8fc"/>
 <text x="40" y="47" font-family="Arial" font-size="25" font-weight="700" fill="#223044">ESP32-C3 SuperMini → NeoPixel WS2812B (5 V)</text>
 <rect x="48" y="94" width="210" height="251" rx="14" fill="#294e67"/>
 <text x="153" y="130" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">ESP32-C3</text>
 <text x="153" y="153" text-anchor="middle" font-family="Arial" font-size="13" fill="#d2e9f2">SuperMini (USB)</text>
 <text x="80" y="205" font-family="monospace" font-size="17" fill="white">GPIO4</text>
 <circle cx="240" cy="199" r="6" fill="#64d6f5"/>
 <text x="80" y="294" font-family="monospace" font-size="17" fill="white">GND</text>
 <circle cx="240" cy="288" r="6" fill="white"/>
 <rect x="367" y="106" width="210" height="187" rx="13" fill="#def1ff" stroke="#2b6087" stroke-width="2"/>
 <text x="471" y="144" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#164b6c">74AHCT125</text>
 <text x="471" y="165" text-anchor="middle" font-family="Arial" font-size="13" fill="#164b6c">VCC pin 14: +5 V</text>
 <text x="471" y="187" text-anchor="middle" font-family="Arial" font-size="13" fill="#164b6c">1OE pin 1: GND</text>
 <text x="398" y="218" font-family="monospace" font-size="16" fill="#184f6a">1A (2)</text>
 <text x="500" y="218" font-family="monospace" font-size="16" fill="#184f6a">1Y (3)</text>
 <path d="M240 199 H363" stroke="#2b6087" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
 <path d="M558 210 H633" stroke="#2b6087" stroke-width="4" fill="none"/>
 <rect x="633" y="195" width="105" height="32" rx="5" fill="#f5e3ac" stroke="#9d7b39" stroke-width="2"/>
 <text x="686" y="216" text-anchor="middle" font-family="Arial" font-size="15" fill="#5c4420">330–470 Ω</text>
 <path d="M738 211 H825" stroke="#2b6087" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="825" y="131" width="173" height="206" rx="12" fill="#e9eaf0" stroke="#475569" stroke-width="2"/>
 <text x="911" y="158" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#223044">NeoPixel</text>
 <text x="911" y="181" text-anchor="middle" font-family="Arial" font-size="15" fill="#223044">WS2812B</text>
 <text x="845" y="214" font-family="monospace" font-size="16" fill="#2b6087">DIN</text>
 <text x="845" y="254" font-family="monospace" font-size="16" fill="#aa3a3a">+5V</text>
 <text x="845" y="298" font-family="monospace" font-size="16" fill="#48515c">GND</text>
 <circle cx="922" cy="279" r="17" fill="#e56055"/><circle cx="960" cy="279" r="17" fill="#55a0df"/><circle cx="941" cy="311" r="17" fill="#55a97d"/>
 <rect x="390" y="360" width="260" height="105" rx="12" fill="#fff3df" stroke="#a66e34" stroke-width="2"/>
 <text x="520" y="388" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#7b4d20">Zasilacz zewnętrzny</text>
 <text x="520" y="415" text-anchor="middle" font-family="Arial" font-size="17" fill="#7b4d20">5 V / odpowiedni prąd</text>
 <path d="M470 360 V293" stroke="#d3534c" stroke-width="4" fill="none"/>
 <path d="M619 360 H800 V247 H820" stroke="#d3534c" stroke-width="4" fill="none"/>
 <text x="490" y="325" font-family="Arial" font-size="12" fill="#a53d38">+5 V</text>
 <path d="M559 360 V288 H825" stroke="#4e5866" stroke-width="4" fill="none"/>
 <path d="M559 288 V287 H240" stroke="#4e5866" stroke-width="4" fill="none"/>
 <path d="M559 288 H577 V269" stroke="#4e5866" stroke-width="4" fill="none"/>
 <text x="44" y="380" font-family="Arial" font-size="15" fill="#404a55">Masa GND musi być wspólna</text>
 <text x="44" y="402" font-family="Arial" font-size="15" fill="#404a55">dla wszystkich modułów.</text>
 <rect x="691" y="365" width="278" height="80" rx="10" fill="white" stroke="#d8dee8"/>
 <text x="708" y="390" font-family="Arial" font-size="16" font-weight="bold" fill="#223044">1000 µF / ≥ 6,3 V</text>
 <text x="708" y="417" font-family="Arial" font-size="14" fill="#48515c">między +5 V a GND taśmy</text>
 <text x="48" y="489" font-family="Arial" font-size="13" fill="#586373">ESP32 zasilaj osobno przez USB. Nie łącz dwóch źródeł 5 V bez kontroli prądów wstecznych.</text>
</svg>